<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mein Buchstaben-Spiel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff8e7;
      margin: 0;
      padding: 30px 15px;
    }

    h1 {
      font-size: 80px;
      margin: 0;
    }

    h2 {
      font-size: 36px;
      margin: 5px 0 20px;
    }

    img {
      max-width: 350px;
      width: 90%;
      height: auto;
      border-radius: 20px;
    }

    p {
      font-size: 20px;
    }

    button {
      font-size: 22px;
      font-weight: bold;
      padding: 18px 25px;
      margin: 8px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1 id="buchstabe">A</h1>
  <h2 id="wort">AFFE</h2>

  <img id="bild" src="a-affe.png" alt="A wie Affe">

  <p>Hör zu und entdecke den Buchstaben!</p>

  <button id="button-buchstabe">
    🔤 BUCHSTABE
  </button>

  <button id="button-wort">
    🔊 WORT
  </button>

  <button id="button-geschichte">
    📖 GESCHICHTE
  </button>


  <script>

    const karten = {

      AFFE: {

        wort: "AFFE",
        bild: "a-affe.png",
        laut: "A",
        wortText: "der Affe",
        geschichte:
          "Anton der Affe liebt Bananen. Heute sucht er seine allergrößte Banane. Kannst du etwas finden, das auch mit A beginnt?"
      },

        wort: "BÄR",

        laut: "B",
        wortText: "der Bär",
        geschichte:
          "Ben der Bär liebt Honig. Heute hat er so viel Honig gefunden, dass seine Pfoten ganz klebrig sind. Kennst du noch ein Wort mit B?"

      DRACHE: {

        wort: "DRACHE",

        laut: "D",

          "Dario der Drache fährt heute auf seinen Rollschuhen. Dabei saust er so schnell, dass ihm fast die Flügel wackeln. Kennst du noch ein Wort mit D?"

      ELEFANT: {
        buchstabe: "E",
        wort: "ELEFANT",
        bild: "e-elefant.png",
        laut: "E",
        wortText: "der Elefant",
        geschichte:
          "Emil der Elefant fährt auf winzigen Rollschuhen. Mit seinem langen Rüssel versucht er das Gleichgewicht zu halten. Findest du noch ein Wort mit E?"

      ESEL: {

        wort: "ESEL",

      },

      },

      LOEWE: {
        buchstabe: "L",
        wort: "LÖWE",

      },

      TIGER: {

        wort: "TIGER",

        laut: "T",

          "Theo der Tiger hält sich am großen T fest. Dabei wackelt sein gestreifter Schwanz hin und her. Kennst du noch ein Wort mit T?"
      },

      UNGEHEUER: {
        buchstabe: "U",

        bild: "u-ungeheuer.png",
        laut: "U",
        wortText: "das Ungeheuer",
        geschichte:
          "Udo das Ungeheuer macht heute einen riesigen Spagat. Dabei streckt es beide Arme hoch und sieht fast selbst wie ein U aus. Kennst du noch ein Wort mit U?"
      },

      VAMPIR: {
        buchstabe: "V",
        wort: "VAMPIR",
        bild: "v-vampir.png",
        laut: "V",
        wortText: "der Vampir",
        geschichte:
          "Viktor der Vampir zeigt seine spitzen Zähne. Aber keine Sorge, dieser Vampir möchte lieber lachen als erschrecken. Kennst du noch ein Wort mit V?"
      },

      WAL: {
        buchstabe: "W",
        wort: "WAL",
        bild: "w-wal.png",
        laut: "W",
        wortText: "der Wal",
        geschichte:
          "Willi der Wal spritzt eine riesige Wasserfontäne in die Luft. Dabei platscht das Wasser überall herum. Kennst du noch ein Wort mit W?"
      },

      XYLOPHON: {
        buchstabe: "X",
        wort: "XYLOPHON",
        bild: "x-xylophon.png",
        laut: "X",
        wortText: "das Xylophon",
        geschichte:
          "Xaver spielt auf seinem bunten Xylophon. Jeder Schlag macht einen anderen lustigen Ton. Kennst du noch ein Wort mit X?"
      },

      YAK: {
        buchstabe: "Y",
        wort: "YAK",
        bild: "y-yak.png",
        laut: "Y",
        wortText: "der Yak",
        geschichte:
          "Yuri der Yak ist groß, zottelig und ziemlich lustig. Heute versucht er mit seinen Armen ein großes Y zu formen."
      },

      ZEBRA: {
        buchstabe: "Z",
        wort: "ZEBRA",
        bild: "z-zebra.png",
        laut: "Z",
        wortText: "das Zebra",
        geschichte:
          "Zora das Zebra zeigt stolz seine schwarzen und weißen Streifen. Heute versucht sie sogar selbst wie ein großes Z auszusehen. Kennst du noch ein Wort mit Z?"
      }

    };


    function sprechen(text) {
      window.speechSynthesis.cancel();

      const stimme = new SpeechSynthesisUtterance(text);

      stimme.lang = "de-DE";
      stimme.rate = 0.85;

      window.speechSynthesis.speak(stimme);
    }


    const parameter =
      new URLSearchParams(window.location.search);

    let karte =
      parameter.get("karte");

    if (karte) {
      karte = karte.toUpperCase();
    }


    const kuerzel = {
      A: "AFFE",
      B: "BAER",
      C: "CLOWN",
      D: "DRACHE",
      E: "ELEFANT",
      F: "FURZ",
      G: "GEIST",
      H: "HAI",
      I: "IGEL",
      J: "JAGUAR",
      K: "KOENIG",
      L: "LOEWE",
      M: "MONSTER",
      N: "NUDELN",
      O: "OMA",
      P: "PIZZA",
      Q: "QUALLE",
      R: "RATTE",
      S: "SUPERHELD",
      SCH: "SCHEISSE",
      T: "TIGER",
      U: "UNGEHEUER",
      V: "VAMPIR",
      W: "WAL",
      X: "XYLOPHON",
      Y: "YAK",
      Z: "ZEBRA"
    };


    if (kuerzel[karte]) {
      karte = kuerzel[karte];
    }


    const daten =
      karten[karte] || karten.AFFE;


    document
      .getElementById("buchstabe")
      .textContent = daten.buchstabe;


    document
      .getElementById("wort")
      .textContent = daten.wort;


    const bild =
      document.getElementById("bild");

    bild.src = daten.bild;

    bild.alt =
      daten.buchstabe + " wie " + daten.wort;


    document
      .getElementById("button-buchstabe")
      .onclick = function() {
        sprechen(daten.laut);
      };


    document
      .getElementById("button-wort")
      .onclick = function() {
        sprechen(daten.wortText);
      };


    document
      .getElementById("button-geschichte")
      .onclick = function() {
        sprechen(daten.geschichte);
      };

  </script>

</body>

</html>
