<!DOCTYPE html>
<html lang="de">
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #fff8e7;
    margin: 0;
    padding: 30px 15px;
  }

  h1 {
    font-size: 80px;
    margin: 0;
  }

  h2 {
    font-size: 36px;
    margin: 5px 0 20px;
  }

  button {
    font-size: 24px;
    font-weight: bold;
    padding: 18px 30px;
    border-radius: 18px;
    border: none;
    cursor: pointer;
  }
</style>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Buchstaben-Spiel</title>
</head>

<body>

  <h1>A</h1>
  <h2>AFFE</h2>

  <img src="a-affe.png" alt="A wie Affe" style="max-width: 350px; width: 90%; height: auto;">
  
  <p>Willkommen beim Buchstaben-Spiel!</p>

  <button onclick="vorlesen()">🔊 VORLESEN</button>

  <script>
    function vorlesen() {
      const text = "Aaaa. A wie Affe! Anton der Affe liebt Bananen.";
      const stimme = new SpeechSynthesisUtterance(text);
      stimme.lang = "de-DE";
      window.speechSynthesis.speak(stimme);
    }
  </script>

</body>
</html>
