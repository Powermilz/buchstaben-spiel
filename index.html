<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mein Buchstaben-Spiel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff8e7;
      margin: 0;
      padding: 30px 15px;
    }

    h1 {
      font-size: 80px;
      margin: 0;
    }

    h2 {
      font-size: 36px;
      margin: 5px 0 20px;
    }

    img {
      max-width: 350px;
      width: 90%;
      height: auto;
    }

    button {
      font-size: 24px;
      font-weight: bold;
      padding: 18px 30px;
      margin: 8px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1 id="buchstabe">A</h1>

  <h2 id="wort">AFFE</h2>

  <img
    id="bild"
    src="a-affe.png"
    alt="A wie Affe"
  >

  <p>Willkommen beim Buchstaben-Spiel!</p>

  <button id="button-buchstabe">
    🔤 BUCHSTABE
  </button>

  <button id="button-wort">
    🐒 WORT
  </button>

  <button id="button-geschichte">
    📖 GESCHICHTE
  </button>

  <script>
    const karten = {
      A: {
        buchstabe: "A",
        wort: "AFFE",
        bild: "a-affe.png",
        laut: "Aaaaa",
        wortText: "A wie Affe",
        geschichte:
          "Anton der Affe liebt Bananen. Heute sucht er seine allergrößte Banane. Kannst du etwas finden, das auch mit A beginnt?"
      },

      F: {
        buchstabe: "F",
        wort: "FURZ",
        bild: "f-furz.png",
        laut: "Fffff",
        wortText: "F wie Furz",
        geschichte:
          "Freddy der Frosch hat einen riesigen Furz gelassen. Kannst du ein anderes Wort finden, das mit F beginnt?"
      }
    };

    function sprechen(text) {
      window.speechSynthesis.cancel();

      const stimme = new SpeechSynthesisUtterance(text);

      stimme.lang = "de-DE";
      stimme.rate = 0.85;

      window.speechSynthesis.speak(stimme);
    }

    const parameter = new URLSearchParams(window.location.search);
    const karte = parameter.get("karte");

    const daten = karten[karte] || karten.A;

    document.getElementById("buchstabe").textContent = daten.buchstabe;
    document.getElementById("wort").textContent = daten.wort;

    const bild = document.getElementById("bild");
    bild.src = daten.bild;
    bild.alt = daten.buchstabe + " wie " + daten.wort;

    document.getElementById("button-buchstabe").onclick = function() {
      sprechen(daten.laut);
    };

    document.getElementById("button-wort").onclick = function() {
      sprechen(daten.wortText);
    };

    document.getElementById("button-geschichte").onclick = function() {
      sprechen(daten.geschichte);
    };
  </script>

</body>

</html>
